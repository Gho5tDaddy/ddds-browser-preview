<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171014">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="TemplateData/touch-pad.css">
  <title>Dice, Drinks &amp; Death Saves — The Video Game</title>
  <style>
    :root{color-scheme:dark;font-family:Georgia,serif;color:#f5e3bc;background:#171014}
    *{box-sizing:border-box}body{margin:0;width:100vw;height:100dvh;overflow:hidden}
    #game{position:relative;width:100%;height:100%;background:#110e12}
    canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
    #loading{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,#302023,#110e12 75%)}
    #loading[hidden]{display:none}.panel{width:min(86vw,620px);text-align:center;padding:28px}
    .logo{width:min(100%,520px);height:auto}.label{font:14px system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#d9b772}
    progress{appearance:none;width:100%;height:10px;margin:24px 0 10px;border:2px solid #a98243;background:#21171a}
    progress::-webkit-progress-bar{background:#21171a}progress::-webkit-progress-value{background:#e9c477}
    progress::-moz-progress-bar{background:#e9c477}#status{font:16px/1.6 system-ui,sans-serif;min-height:52px}
    .hint{font:13px/1.6 system-ui,sans-serif;color:#c4b5a2;margin-top:16px}
    button{border:1px solid #be9955;background:#251a1e;color:#f7e6c5;padding:10px 16px;cursor:pointer;font:14px system-ui,sans-serif}
    button:focus-visible{outline:2px solid #fff1c7;outline-offset:3px}
    @media (hover:hover){button:hover{background:#433027}}
    #fullscreen{position:absolute;right:10px;top:10px;padding:7px 10px;background:#171014c9}
  </style>
</head>
<body>
  <main id="preview">
    <div id="game">
      <canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="Dice, Drinks and Death Saves game"></canvas>
      <button id="fullscreen" aria-label="Enter fullscreen" hidden>Fullscreen</button>
    </div>
    <section class="touch-deck touch-left" aria-label="Movement and menu controls">
      <div class="touch-row">
        <button data-pad="12">Pause <small>Menu</small></button>
        <button data-pad="13">Bag <small>View</small></button>
      </div>
      <div id="touch-stick" aria-label="Drag to move"><span></span></div>
      <div class="touch-row">
        <button data-pad="10">Block <small>LB</small></button>
        <button data-pad="14">Signature <small>LT</small></button>
      </div>
      <div class="touch-row">
        <button data-pad="2" aria-label="Previous item or menu choice">Prev</button>
        <button data-pad="1" aria-label="Use selected item">Use</button>
        <button data-pad="3" aria-label="Next item or menu choice">Next</button>
      </div>
    </section>
    <section class="touch-deck touch-right" aria-label="Combat controls">
      <div class="touch-row">
        <button data-pad="15" aria-label="Hold Special and tap Light, Heavy, or Evade">Special <small>RT</small></button>
        <button data-pad="11">Interact <small>RB</small></button>
      </div>
      <div class="touch-row">
        <button data-pad="7">Light <small>X</small></button>
        <button data-pad="4">Heavy <small>Y</small></button>
      </div>
      <div class="touch-row">
        <button class="primary" data-pad="6">Jump / OK <small>A</small></button>
        <button data-pad="5">Evade / Back <small>B</small></button>
      </div>
    </section>
    <div id="loading" role="status" aria-live="polite">
      <div class="panel">
        <img class="logo" src="TemplateData/title.png" alt="Dice, Drinks and Death Saves — The Video Game">
        <p class="label">Playable development preview</p>
        <progress id="progress" value="0" max="1" aria-label="Game download progress"></progress>
        <div id="status">Preparing your adventure…</div>
        <button id="retry" hidden>Try again</button>
        <p class="hint desktop-hint">Keyboard or a supported gamepad.</p>
        <p class="hint touch-hint">Tap <strong>Jump / OK</strong> at the title. Turn your phone sideways for a larger game view.</p>
        <p class="hint">The first load downloads about 230 MB. Progress is saved in this browser.</p>
      </div>
    </div>
  </main>
  <script src="TemplateData/touch-pad.js"></script>
  <script>
    'use strict';
    const canvas=document.querySelector('#unity-canvas');
    const loading=document.querySelector('#loading');
    const status=document.querySelector('#status');
    const progress=document.querySelector('#progress');
    const retry=document.querySelector('#retry');
    const fullscreen=document.querySelector('#fullscreen');
    const previewState={phase:'loading',progress:0};
    window.dddsPreviewState=previewState;
    // Keep normal game keys from opening browser panels or moving focus away.
    // Do not stop propagation: Unity must still receive the trusted key event.
    window.addEventListener('keydown',event=>{
      if(document.activeElement!==canvas)return;
      if(['Tab',' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key) ||
        event.ctrlKey && ['j','k','l'].includes(event.key.toLowerCase()))event.preventDefault();
    },true);
    retry.onclick=()=>location.reload();
    function fail(message,error){
      previewState.phase='error';
      loading.hidden=false;
      progress.hidden=true;
      status.textContent=message;
      retry.hidden=false;
      if(error)console.error(error);
    }
    async function boot(){
      if(!('serviceWorker' in navigator) || !('DecompressionStream' in window))
        throw new Error('This preview requires HTTPS and a current browser.');
      await navigator.serviceWorker.register('preview-worker.js',{scope:'./',updateViaCache:'none'});
      await navigator.serviceWorker.ready;
      if(!navigator.serviceWorker.controller)await new Promise(resolve=>
        navigator.serviceWorker.addEventListener('controllerchange',resolve,{once:true}));
      const script=document.createElement('script');
      script.src='Build/e9cc4fa066efef3f527ea59ac0b00d9b.loader.js';
      await new Promise((resolve,reject)=>{script.onload=resolve;script.onerror=reject;document.body.append(script);});
      const hasTouch=!!window.dddsReadTouchPad;
      // Cap the buffer for the larger landscape view, even when launched in portrait.
      const expectedTouchWidth=Math.min(1280,Math.max(canvas.clientWidth,Math.min(innerWidth,innerHeight)*16/9));
      const pixelRatioLimit=hasTouch ? Math.min(1.5,960/expectedTouchWidth) : 2;
      const config={
        arguments:[],
        dataUrl:'Build/8a041dedb7f04196c8fe8566dedad599.data',
        frameworkUrl:'Build/fbd9eb414d341d4594e46a8374ed8a38.framework.js',
        codeUrl:'Build/4c33386bc20a73c6200e7f503c3a258d.wasm',
        streamingAssetsUrl:'StreamingAssets',
        companyName:"DDDS",
        productName:"Dice Drinks and Death Saves",
        productVersion:"1.0",
        autoSyncPersistentDataPath:true,
        devicePixelRatio:Math.min(window.devicePixelRatio||1,pixelRatioLimit),
        showBanner:(message,type)=>{if(type==='error')console.error(message);else console.warn(message);}
      };
      const instance=await createUnityInstance(canvas,config,value=>{
        progress.value=value;
        previewState.progress=value;
        status.textContent='Loading your adventure… '+Math.round(value*100)+'%';
      });
      previewState.phase='ready';
      loading.hidden=true;
      fullscreen.hidden=hasTouch;
      fullscreen.onclick=()=>{canvas.focus({preventScroll:true});instance.SetFullscreen(1);};
      canvas.focus({preventScroll:true});
    }
    async function start(){
      if(!navigator.locks){
        fail('Please use a current version of Chrome, Edge, Firefox or Safari to play.');
        return;
      }
      const directory=new URL('.',location.href).pathname;
      await navigator.locks.request('ddds-preview-profile:'+directory,{ifAvailable:true},async lock=>{
        if(!lock){fail('This game is already open in another tab. Close that copy, then try again.');return;}
        try{
          await boot();
          // Hold ownership until this document closes, including while it is in the background.
          await new Promise(()=>{});
        }catch(error){fail('The game could not start. Try a current browser such as Safari on iPhone or Chrome on Android.',error);}
      });
    }
    start().catch(error=>fail('Your browser could not open this game. Please try again.',error));
  </script>
</body>
</html>
